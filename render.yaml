# Render Blueprint — Agent CV
#
# Deploys the backend as a Node "web service" connected to this GitHub repo.
# Docs: https://render.com/docs/blueprint-spec
#
# IMPORTANT:
#  - Plan `starter` (~$7/month): always-on instance, required for incoming calls. The
#    `free` plan SLEEPS after 15 min without traffic and takes ~1 min to wake, which
#    would make incoming calls fail. (During setup we temporarily used `free` to deploy
#    without a card; switched to `starter` before the real phone-call test.)
#  - Secrets use `sync: false`: they are NOT stored here; fill them in the Render
#    dashboard (Environment) after creating the service. This way they never end up in
#    the repository.
#  - `STREAM_TOKEN_SECRET` is auto-generated (`generateValue: true`).
#  - No need to set PUBLIC_URL: the code uses RENDER_EXTERNAL_URL automatically.

services:
  - type: web
    name: agent-cv
    runtime: node
    plan: starter
    region: frankfurt            # close to Europe (ES/EU callers). Adjustable.
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Non-sensitive config (fixed values) ---
      - key: HOST
        value: 0.0.0.0           # in the cloud we do listen on all interfaces
      - key: LOG_FORMAT
        value: json              # structured logs for Render's aggregator
      - key: VALIDATE_TWILIO_SIGNATURE
        value: "true"
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-mini
      - key: OPENAI_VOICE
        value: alloy
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: OPENAI_SUMMARY_MODEL
        value: gpt-4o-mini
      - key: EMAIL_PROVIDER
        value: resend
      # --- Secret auto-generated by Render ---
      - key: STREAM_TOKEN_SECRET
        generateValue: true
      # --- Secrets / personal data: filled in the dashboard (sync:false) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER   # the LU number once Twilio approves it
        sync: false
      - key: MY_PERSONAL_NUMBER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
